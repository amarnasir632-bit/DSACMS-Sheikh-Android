plugins {
    id 'com.android.application'
}

def releaseSigningConfigured = System.getenv('DSA_RELEASE_STORE_FILE')
        && System.getenv('DSA_RELEASE_STORE_PASSWORD')
        && System.getenv('DSA_RELEASE_KEY_ALIAS')
        && System.getenv('DSA_RELEASE_KEY_PASSWORD')

// Firebase setup remains optional until the real Firebase project config is added.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.dsacms.sheikhrequests'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dsacms.sheikhrequests'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    if (releaseSigningConfigured) {
        signingConfigs {
            release {
                storeFile file(System.getenv('DSA_RELEASE_STORE_FILE'))
                storePassword System.getenv('DSA_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('DSA_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('DSA_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
}
